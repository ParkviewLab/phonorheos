name: Windows spike

# Temporary, removed before the pull request: does the bundled Python install on
# Windows and make speech with no espeak-ng? Does the MSI build, install and run?

on:
  push:
    branches: [feature-windows-build]

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Prepare the bundled Python
        run: time scripts/prepare-python
      - name: Make speech with the helper
        run: |
          PY=crates/phonorheos-app/python/python.exe
          export HF_HOME="$RUNNER_TEMP/models" HF_HUB_DISABLE_TELEMETRY=1 TOKENIZERS_PARALLELISM=false
          printf '%s\n' '{"op":"speak","id":"a","text":"Hello from Windows. It is 10:43 AM."}' '{"op":"quit"}' \
            | (time "$PY" -I -B -m phonorheos_helper) > out.jsonl
          "$PY" -I -c "
          import json, sys
          ev = [json.loads(l) for l in open('out.jsonl', encoding='utf-8') if l.strip()]
          kinds = [e['event'] for e in ev]
          print({k: kinds.count(k) for k in set(kinds)})
          errs = [e for e in ev if e['event'] == 'error']
          print(errs)
          sys.exit(0 if 'audio' in kinds and not errs else 1)
          "

      - name: Start the helper as the app does, and list what it starts
        timeout-minutes: 30
        run: |
          cat > "$RUNNER_TEMP/drive.py" <<'PY'
          import json, os, subprocess, sys, threading, time
          py, close_input, home = sys.argv[1], sys.argv[2] == "close", sys.argv[3]
          env = dict(os.environ, HF_HOME=home, HF_HUB_DISABLE_TELEMETRY="1", TOKENIZERS_PARALLELISM="false")
          p = subprocess.Popen([py, "-I", "-B", "-m", "phonorheos_helper"], env=env, creationflags=0x08000000,
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          err, events = [], []
          threading.Thread(target=lambda: err.extend(p.stderr), daemon=True).start()
          threading.Thread(target=lambda: events.extend(json.loads(l)["event"] for l in p.stdout), daemon=True).start()
          p.stdin.write(b'{"op":"words","words":{}}\n{"op":"load"}\n'); p.stdin.flush()
          if close_input:
              p.stdin.close()
          def children():
              q = ("Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId, Name, "
                   "@{n='CPU';e={(Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue).CPU}}, CommandLine "
                   "| ConvertTo-Json -Compress")
              procs = json.loads(subprocess.run(["powershell", "-NoProfile", "-Command", q], capture_output=True, text=True).stdout)
              tree, found = {p.pid}, []
              for _ in range(4):
                  for x in procs:
                      if x["ParentProcessId"] in tree and x["ProcessId"] not in tree:
                          tree.add(x["ProcessId"]); found.append(x)
              return found
          start = time.time()
          while time.time() - start < 480 and "ready" not in events and "error" not in events:
              time.sleep(30)
              print(f"{time.time() - start:.0f}s events={sorted(set(events))} helper_alive={p.poll() is None}")
              for x in children():
                  print("   child", x["ProcessId"], x["Name"], "cpu", x["CPU"], (x["CommandLine"] or "")[:400])
          print("RESULT", "close" if close_input else "open", "ready" if "ready" in events else "not ready")
          subprocess.run(["taskkill", "/T", "/F", "/PID", str(p.pid)], capture_output=True)
          time.sleep(2)
          print("stderr tail:"); print(b"".join(err).decode("utf-8", "replace")[-3000:])
          PY
          PY=crates/phonorheos-app/python/python.exe
          "$PY" -I -u "$RUNNER_TEMP/drive.py" "$PY" open "$RUNNER_TEMP/models-a" || true
          "$PY" -I -u "$RUNNER_TEMP/drive.py" "$PY" close "$RUNNER_TEMP/models-b" || true

  installer:
    if: false
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Tauri
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the MSI
        run: scripts/build-app
      - name: Install and check it
        run: scripts/smoke-windows
        timeout-minutes: 30
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: installers-windows
          path: |
            dist/*.msi
            install.log

  rust:
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
