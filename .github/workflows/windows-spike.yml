name: Windows spike

# Temporary, removed before the pull request: does the bundled Python install on
# Windows and make speech with no espeak-ng? Does the MSI build, install and run?

on:
  push:
    branches: [feature-windows-build]

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Prepare the bundled Python
        run: time scripts/prepare-python
      - name: Make speech with the helper
        run: |
          PY=crates/phonorheos-app/python/python.exe
          export HF_HOME="$RUNNER_TEMP/models" HF_HUB_DISABLE_TELEMETRY=1 TOKENIZERS_PARALLELISM=false
          printf '%s\n' '{"op":"speak","id":"a","text":"Hello from Windows. It is 10:43 AM."}' '{"op":"quit"}' \
            | (time "$PY" -I -B -m phonorheos_helper) > out.jsonl
          "$PY" -I -c "
          import json, sys
          ev = [json.loads(l) for l in open('out.jsonl', encoding='utf-8') if l.strip()]
          kinds = [e['event'] for e in ev]
          print({k: kinds.count(k) for k in set(kinds)})
          errs = [e for e in ev if e['event'] == 'error']
          print(errs)
          sys.exit(0 if 'audio' in kinds and not errs else 1)
          "

      - name: Start the helper as the app does, with and without CREATE_NO_WINDOW
        timeout-minutes: 25
        run: |
          cat > "$RUNNER_TEMP/drive.py" <<'PY'
          import json, os, subprocess, sys, threading, time
          py, flags, home = sys.argv[1], int(sys.argv[2], 0), sys.argv[3]
          env = dict(os.environ, HF_HOME=home, HF_HUB_DISABLE_TELEMETRY="1", TOKENIZERS_PARALLELISM="false")
          code = ("import faulthandler, runpy; faulthandler.dump_traceback_later(420, exit=True); "
                  "runpy.run_module('phonorheos_helper', run_name='__main__')")
          p = subprocess.Popen([py, "-I", "-B", "-c", code], env=env, creationflags=flags,
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          err = []
          threading.Thread(target=lambda: err.extend(p.stderr), daemon=True).start()
          p.stdin.write(b'{"op":"words","words":{}}\n{"op":"load"}\n'); p.stdin.flush()
          start, last, result = time.time(), None, "no answer"
          for line in p.stdout:
              ev = json.loads(line)
              if ev["event"] == "progress":
                  last = ev
                  continue
              print(f"{time.time() - start:.0f}s", ev)
              if ev["event"] in ("ready", "error"):
                  result = ev["event"]
                  break
          print("last progress:", last)
          p.kill()
          time.sleep(1)
          print("stderr:")
          print(b"".join(err).decode("utf-8", "replace")[-6000:])
          print("RESULT", hex(flags), result)
          PY
          PY=crates/phonorheos-app/python/python.exe
          "$PY" -I "$RUNNER_TEMP/drive.py" "$PY" 0 "$RUNNER_TEMP/models-a" || true
          "$PY" -I "$RUNNER_TEMP/drive.py" "$PY" 0x08000000 "$RUNNER_TEMP/models-b" || true

  installer:
    if: false
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Tauri
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the MSI
        run: scripts/build-app
      - name: Install and check it
        run: scripts/smoke-windows
        timeout-minutes: 30
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: installers-windows
          path: |
            dist/*.msi
            install.log

  rust:
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
