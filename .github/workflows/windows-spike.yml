name: Windows spike

# Temporary, removed before the pull request: does the bundled Python install on
# Windows and make speech with no espeak-ng? Does the MSI build, install and run?

on:
  push:
    branches: [feature-windows-build]

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Prepare the bundled Python
        run: time scripts/prepare-python
      - name: Make speech with the helper
        run: |
          PY=crates/phonorheos-app/python/python.exe
          export HF_HOME="$RUNNER_TEMP/models" HF_HUB_DISABLE_TELEMETRY=1 TOKENIZERS_PARALLELISM=false
          printf '%s\n' '{"op":"speak","id":"a","text":"Hello from Windows. It is 10:43 AM."}' '{"op":"quit"}' \
            | (time "$PY" -I -B -m phonorheos_helper) > out.jsonl
          "$PY" -I -c "
          import json, sys
          ev = [json.loads(l) for l in open('out.jsonl', encoding='utf-8') if l.strip()]
          kinds = [e['event'] for e in ev]
          print({k: kinds.count(k) for k in set(kinds)})
          errs = [e for e in ev if e['event'] == 'error']
          print(errs)
          sys.exit(0 if 'audio' in kinds and not errs else 1)
          "

  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Tauri
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the MSI
        run: scripts/build-app
      - name: Install and check it
        run: scripts/smoke-windows
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: installers-windows
          path: |
            dist/*.msi
            install.log

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
