name: Windows spike

# Temporary, removed before the pull request: does the setup.exe build, install, run
# and uninstall?

on:
  push:
    branches: [feature-windows-build]

permissions:
  contents: read

jobs:
  helper:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --group dev
      - run: uv run pytest -m "not network and not integration" -q

  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Tauri
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the installer
        run: scripts/build-app
      - name: Install and check it
        run: scripts/smoke-windows
        timeout-minutes: 30
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: installers-windows
          path: dist/*-setup.exe
