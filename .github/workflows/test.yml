name: Test

# The Rust workspace builds, is lint-clean and passes its tests on macOS and Ubuntu,
# and the Python helper passes its checks. The helper's unit tests need no voice
# (Kokoro and PyTorch are its `voice` extra, installed only into the app's bundled Python).

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  helper:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Sync deps
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run ty check
      - name: Tests (excluding the network and integration markers)
        run: uv run pytest -m "not network and not integration" -q
