# The Python helper that phonorheos carries and starts: Kokoro with misaki, no espeak-ng.
# It is not published on its own; the app's version is the repository's VERSION.txt.
[project]
name = "phonorheos-helper"
version = "0"
description = "The voice of phonorheos: turns text into speech with Kokoro and misaki"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "Gary Frattarola", email = "garyf@parkviewlab.ai" }]
dependencies = []

[project.optional-dependencies]
# The voice itself. Installed into the bundled Python at build time; the tests of the
# protocol and the word list need none of it.
voice = [
    "kokoro==0.9.4",
    "misaki",
    "torch",
    "transformers",
    "spacy>=3.8,<3.9",
    "en-core-web-sm",
    "num2words",
    "addict",
    "regex",
    "attrs",            # used by kokoro, not declared by it
    "huggingface-hub",
    "loguru",
    "numpy",
]

[project.scripts]
phonorheos-helper = "phonorheos_helper.__main__:main"

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phonorheos_helper"]

[tool.uv]
# kokoro asks for misaki[en], whose extra brings phonemizer-fork and espeakng-loader
# (espeak-ng, GPL-3.0). Overriding the requirement with plain misaki keeps espeak-ng out;
# misaki is pinned to a commit of its GitHub source, whose neural fallback replaces it.
override-dependencies = [
    "misaki @ git+https://github.com/hexgrad/misaki@fba1236595f2d2bf21d414ba6e57d25256afada3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require outbound network access",
    "integration: end-to-end tests that load the voice",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.12"
